<!DOCTYPE html>
<html>
    <head>
        <title>Page Title</title>
    </head>
    <body>
        <h1>Student Information Form</h1>
        <h5>Senior High School Enrollment-Grade 11</h5>
        
        
            <fieldset>
                <legend>Personal Information</legend>
                <form action="save.html" method="GET"
        <label>First Name:</label>
        <input Type="text" placeholder="Enter First Name" required>
        <label>Last Name:</label>
        <input Type="text" placeholder="Enter Last Name" required>
         <label>Middle Initial:</label>
        <input Type="text" placeholder="Enter Middle Name" required> <br>
        <label>Email Address:</label>
        <input Type="text" placeholder="you@example.com" required>
        <label>Password:</label>
        <input Type="text" placeholder="Create a Password" required> <br>
        <label>Age:</label>
        <input Type="text" placeholder="e.g 16" required>
        <label>Birthday:</label>
        <input Type="date" placeholder="mm/dd/yyyy" required> <br>
        <label>Document:</label>
        <input Type="file" name="file"" required> <br>
        </fieldset>
        
        
        <fieldset>
                <legend>Student Information</legend>
        <label>Student ID:</label>
        <input Type="text" placeholder="e.g 2526M00243" required> <br>
        <label>Grade level:</label>
        <select>
            <option>11</option>
            <option>12</option>
        </select>
        <input Type="text" placeholder="Select grade level" required>
         <label>Strand:</label>
         <select>
             <option>CPT</option>
             <option>BMA</option>
             <option>HTM</option>
             <option>SS</option>
         </select>
        <input Type="text" placeholder="Select Strand" required> <br>
      
      <fieldset>
                <legend>Additional Information</legend>
        <label>Gender:</label>
        <input type="radio" name="gender" value="male">
<label>Male</label>
<input type="radio" name="gender" value="female">
<label>Female</label>
<input type="radio" name="gender" value="prefer not to say">
<label>Prefer not to say</label>
<br>
<br>
<label>Hobbies</label>
<br>
<input type="checkbox" name="hobbies" value="reading">
<label>Reading</label>
<input type="checkbox" name="hobbies" value="swimming">
<label>Swimming</label>
<input type="checkbox" name="hobbies" value="coding">
<label>Coding</label>
<input type="checkbox" name="hobbies" value="playing sports">
<label>Playing Sports</label>
<input type="checkbox" name="hobbies" value="watching movies">
<label>Watching Movies</label>
        <br>
<input type="checkbox" name="hobbies" value="playing games">
<label>Playing Games</label>
<input type="checkbox" name="hobbies" value="music">
<label>Music</label>
<br>
<br>
<label>Complete Address</label>
<input type="text" placeholder="House No., Street, Barangay, City, Province" required><br>
</form>
</fieldset>
        
        <input type="submit" value="Submit">
<input type="reset" value="Reset">

    </body>
</html>
    </body>
</html>
